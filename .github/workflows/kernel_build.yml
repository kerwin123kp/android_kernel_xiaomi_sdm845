name: Build Kernel for Xiaomi SDM845 (LineageOS 22.1)

on:
  push:
    branches:
      - main  # Trigger workflow on push to the main branch
  workflow_dispatch:  # Allow manual triggering from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the kernel repository
      - name: Checkout kernel repository
        uses: actions/checkout@v2
        with:
          repository: kerwin123kp/android_kernel_xiaomi_sdm845  # Kernel repo
          ref: lineage-22.1  # Branch for LineageOS 22.1

      # Step 2: Set up cross-compilation toolchain
      - name: Set up cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu make bc bison flex \
          libssl-dev libelf-dev libncurses5-dev wget

      # Step 3: Use the perseus_config from arch/arm64/configs
      - name: Use perseus_config from arch/arm64/configs
        run: |
          # Move the perseus_config to the root .config file
          cp arch/arm64/configs/perseus_config .config

      # Step 4: Apply defconfig (perseus_defconfig)
      - name: Apply defconfig (perseus_defconfig)
        run: |
          make ARCH=arm64 -j$(nproc) perseus_defconfig  # Apply your default config

      # Step 5: Disable 32-bit ARM compatibility and ensure CROSS_COMPILE_ARM32 is not set
      - name: Disable 32-bit ARM compatibility
        run: |
          # Disable 32-bit ARM compatibility by modifying the config file
          sed -i 's/CONFIG_ARM64_32=y/CONFIG_ARM64_32=n/' .config
          sed -i '/CROSS_COMPILE_ARM32/d' .config  # Remove any CROSS_COMPILE_ARM32 entries

      # Step 6: Build the kernel
      - name: Build the kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      # Step 7: Check if the kernel image exists
      - name: Check if kernel image exists
        run: |
          if [ -f arch/arm64/boot/Image ]; then
            echo "Kernel image exists."
          else
            echo "Kernel image does not exist."
            exit 1  # Exit if the image doesn't exist
          fi

      # Step 8: Upload Kernel Artifact
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: arch/arm64/boot/Image  # Path to the kernel image
